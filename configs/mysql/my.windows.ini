# Native Windows MySQL configuration for the V3.0 120-enterprise experiment.
# Target: MySQL Community Server 8.0, matching configs/data/enterprise_v30_120.json.
# Use 8.0.16 or newer so that CHECK constraints are enforced.
#
# This file is loaded only when explicitly passed with --defaults-file.
# It does not install MySQL, create accounts, or import the experiment data.
# Passwords belong in interactive prompts / ENTERPRISE_MYSQL_PASSWORD.
#
# Local layout (edit basedir if your extracted MySQL directory differs):
#   Binaries: D:/tools/mysql-8.0/bin/mysqld.exe and mysql.exe
#   Data:     D:/lifelonglearning/mysql/data
#   Logs:     D:/lifelonglearning/mysql/logs
# Create the logs directory before startup; use a new, dedicated data directory.
# Use forward slashes for Windows paths in this file.
#
# Initialize a NEW instance once, using only directory options:
#   & 'D:\tools\mysql-8.0\bin\mysqld.exe' --no-defaults --initialize --console `
#       --basedir='D:/tools/mysql-8.0' --datadir='D:/lifelonglearning/mysql/data'
# Keep the temporary root password locally; never paste it into a shared log.
# Stop if initialization fails. Never delete/reinitialize an existing data directory.
#
# Start explicitly from PowerShell (the console remains occupied):
#   & 'D:\tools\mysql-8.0\bin\mysqld.exe' `
#       '--defaults-file=D:\论文\LifelongLearning-business\configs\mysql\my.windows.ini' --console
#
# After startup, create the database/tables with the original bundle SQL,
# then create the synthetic account and run the existing import/accept commands.
# The application's connection is already configured in configs/business/query_v30_120.yaml.

[client]
host=127.0.0.1
port=3306
protocol=TCP
default-character-set=utf8mb4

[mysqld]
basedir=D:/tools/mysql-8.0
datadir=D:/lifelonglearning/mysql/data-8.0.16
log-error=D:/lifelonglearning/mysql/logs/mysql-8.0.16-error.log

# Matches the existing business and Windows validation connection settings.
bind-address=127.0.0.1
port=3306
# The experiment uses the classic MySQL protocol; no X Protocol listener is needed.
mysqlx=OFF

# Must match the frozen create_database.sql and database_schema.sql.
character-set-server=utf8mb4
collation-server=utf8mb4_0900_ai_ci
default-storage-engine=InnoDB

# Native Windows default; choose before initialization and do not change afterward.
lower_case_table_names=1
transaction-isolation=REPEATABLE-READ
# Keep MySQL's default strict sql_mode and normal writable server state.
# Import selects SERIALIZABLE; acceptance and query execution use read-only transactions.
